[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "solace-assist"
version = "0.2.0a2"
description = "Offline security-tool catalog, CLI and terminal explorer"
requires-python = ">=3.11"
dependencies = []
license = "MIT"
license-files = ["LICENSE", "NOTICE"]

[project.optional-dependencies]
tui = ["textual>=8.2.8"]

[project.scripts]
sbtools = "solace_assist.interfaces.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
solace_assist = ["data/*.json", "data/*.bash", "data/guides/*.json", "data/guides/*.md"]
